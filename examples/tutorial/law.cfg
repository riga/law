[logging]
law: INFO
luigi-interface: INFO


[luigi_core]
local_scheduler: True
parallel_scheduling: False
no_lock: True


[luigi_worker]
keep_alive: True
ping_interval: 20
wait_interval: 20
max_reschedules: 0


[luigi_scheduler]
; do not retry failed tasks, so that runs end immediately after a failure
retry_count: 0
